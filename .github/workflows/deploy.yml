name: Deploy on Push

on:
  push:
    branches: [main]

concurrency:
  group: stock-dashboard-deploy
  cancel-in-progress: false

permissions:
  contents: read

# GitHub Pages は「main ブランチから配信（legacy）」設定のため、push 時に GitHub 側の
# pages-build-deployment が自動で公開する。以前ここにあった actions/deploy-pages ジョブは
# 2026-10-06 に環境待ちで28時間止まり、同じ concurrency の後続デプロイを全てキャンセルさせたので削除。
jobs:
  # ConoHa WING へのFTPデプロイ
  deploy-conoha:
    runs-on: ubuntu-latest
    # 通常30秒。止まっても後続のデプロイを塞がないよう打ち切る
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Inject GA4 tag
        env:
          GA4_ID: ${{ secrets.GA4_ID }}
        run: |
          if [ -n "$GA4_ID" ]; then python3 scripts/inject_ga.py "$GA4_ID"; fi

      - name: Deploy to ConoHa WING via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: www292.conoha.ne.jp
          username: dashboard@stock-overflow24.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /public_html/dashboard.stock-overflow24.com/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            scripts/**
            tests/**
            logs/**
            requirements.txt
            *.md
