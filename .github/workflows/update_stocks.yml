name: Update Stock Data

on:
  schedule:
    # 約15分おきに実行（UTC）※GitHub Actions cron は仕様上ベストエフォートで遅延あり
    - cron: '*/15 * * * *'
  workflow_dispatch:   # 手動実行も可能

# 外部ディスパッチとcronが重なっても、データ生成・pushは必ず1本ずつ実行する
concurrency:
  group: stock-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          # PATを使うことでこのワークフローからのpushがdeploy.ymlを起動できる
          token: ${{ secrets.CRON_TRIGGER_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Test collection and freshness logic
        run: python -m unittest discover -s tests -v

      - name: Fetch futures and FX (先物・為替)
        run: |
          cd ${{ github.workspace }}
          python scripts/run_fetch.py futures --timeout 90
        continue-on-error: true

      - name: Fetch Nikkei 225 heatmap data (日経225ヒートマップ)
        run: |
          cd ${{ github.workspace }}
          python scripts/run_fetch.py nikkei225 --timeout 120
        continue-on-error: true

      # JPX/Yahoo → 日時検証した株探30件 → 楽天P/S/G統合10件 → 日経225限定
      - name: Fetch Japan stocks (TSE Prime/Standard/Growth gainers)
        run: |
          cd ${{ github.workspace }}
          python scripts/run_fetch.py japan_stocks --timeout 420
        continue-on-error: true

      - name: Fetch night PTS ranking (ジャパンネクスト夜間PTS)
        run: |
          cd ${{ github.workspace }}
          python scripts/run_fetch.py pts_ranking --timeout 120
        continue-on-error: true

      - name: Fetch volume surge stocks (出来高急増)
        run: |
          cd ${{ github.workspace }}
          python scripts/run_fetch.py volume_stocks --timeout 60
        continue-on-error: true

      - name: Fetch market-moving news (日本株への影響トピックス)
        run: |
          cd ${{ github.workspace }}
          python scripts/run_fetch.py market_news --timeout 90
        continue-on-error: true

      - name: Fetch earnings flash (決算速報・サプライズ決算)
        run: |
          cd ${{ github.workspace }}
          python scripts/run_fetch.py earnings_flash --timeout 120
        continue-on-error: true

      - name: Fetch theme stocks ranking (テーマ株ランキング・週間/月間騰落)
        run: |
          cd ${{ github.workspace }}
          python scripts/run_fetch.py themes --timeout 90
        continue-on-error: true

      - name: Refresh company profiles (企業概要・一言説明)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p logs
          python scripts/fetch_company_profiles.py > logs/company_profiles.log 2>&1
          tail -60 logs/company_profiles.log

      - name: Preserve per-source fetch logs
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14

      - name: Audit data freshness (件数・更新時刻・部分取得失敗)
        run: |
          cd ${{ github.workspace }}
          python scripts/audit_data_freshness.py

      - name: Prerender index.html (SSG・SEO用に本文を焼き込む)
        run: |
          cd ${{ github.workspace }}
          python scripts/prerender.py
          python scripts/check_site.py

      - name: Check if data changed
        id: check-changes
        run: |
          git diff --quiet -- data/ index.html sitemap.xml themes/ stop-high/ top-gainers/ volume-surge/ earnings/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ index.html sitemap.xml themes/ stop-high/ top-gainers/ volume-surge/ earnings/
          git commit -m "chore: update stock data + prerender [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          # リモートの変更を取り込んでからプッシュ（競合時はリモートを優先）
          git fetch origin main
          git rebase origin/main || (git rebase --abort && echo "rebase skipped")
          git push origin main

      - name: No changes detected
        if: steps.check-changes.outputs.changed != 'true'
        run: echo "Data unchanged, skipping commit."

      # health.json は先に公開し、その後に重大な欠損があればジョブを赤くして見逃しを防ぐ
      - name: Fail workflow on critical stale data
        run: |
          cd ${{ github.workspace }}
          python scripts/audit_data_freshness.py --strict --no-write

  # データ更新後のデプロイは deploy.yml (push トリガー) が担当
  # update-data が git push すると自動的に deploy.yml が起動する
